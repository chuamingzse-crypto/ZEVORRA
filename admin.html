<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEVORA 管理后台</title><style>
*{box-sizing:border-box}body{margin:0;background:#080910;color:#f5f5f7;font-family:Arial,sans-serif;padding:20px}.wrap{max-width:900px;margin:auto}h1{font-size:25px}.muted{color:#aaa;font-size:14px;line-height:1.5}.panel{background:#141620;border:1px solid #303342;border-radius:14px;padding:18px;margin:16px 0}input,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #45485a}input{background:#090a10;color:#fff;width:100%;margin:6px 0 12px}button{background:#9b7bff;color:#080710;font-weight:bold;cursor:pointer;border:0}button.secondary{background:#303342;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.product{display:grid;grid-template-columns:1.2fr 1fr auto auto;gap:10px;align-items:center;border-top:1px solid #303342;padding:12px 0}.product input{margin:0}.status{margin-top:10px;color:#c7b9ff;white-space:pre-wrap}@media(max-width:620px){.product{grid-template-columns:1fr 1fr}.product .full{grid-column:1/-1}.row{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><h1>ZEVORA 管理后台</h1><p class="muted">登录后可修改现有商品价格、名称和显示状态。保存后网站会读取最新价格，无需每次重新上传 HTML。</p>
<section id="login" class="panel"><h2>管理员登录</h2><label>管理员 Email</label><input id="email" type="email" autocomplete="username" placeholder="创建 Supabase Auth 用户时使用的邮箱"><label>密码</label><input id="password" type="password" autocomplete="current-password" placeholder="管理员密码"><button id="loginBtn">登录</button><div id="loginStatus" class="status"></div></section>
<section id="dashboard" class="panel" hidden><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2>商品价格</h2><button class="secondary" id="logoutBtn">退出登录</button></div><p class="muted">价格可填写 RM22 或 22。停用的商品会在顾客网站隐藏。</p><div id="products"></div><div id="status" class="status"></div></section>
<p class="muted">注意：请只在自己的管理后台登录。Supabase publishable key 可放在网页前端；不要把 service_role key 放进 HTML。</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://dmidricrjdrdgqjepjer.supabase.co","sb_publishable_q40EWu0MWPpk1mVmNHQowg_fAI2iBl4");
const $=id=>document.getElementById(id);function say(id,msg){$ (id).textContent=msg;}
async function showProducts(){say('status','正在读取商品…');const {data,error}=await db.from('products').select('id,name,category,price,active,sort_order').order('sort_order');if(error){say('status','读取失败：'+error.message);return;}$('products').innerHTML='';for(const p of (data||[])){const row=document.createElement('div');row.className='product';row.innerHTML=`<div class="full"><b></b><div class="muted"></div></div><input aria-label="价格" value=""><label><input type="checkbox" style="width:auto;margin:0 5px 0 0">显示</label><button>保存</button>`;row.querySelector('b').textContent=p.name;row.querySelector('.muted').textContent=p.category;const price=row.querySelector('input[aria-label="价格"]');price.value=p.price;const active=row.querySelector('input[type="checkbox"]');active.checked=p.active!==false;row.querySelector('button').addEventListener('click',async()=>{const val=price.value.trim();if(!val){say('status','价格不能为空');return;}const {error}=await db.from('products').update({price:val,active:active.checked}).eq('id',p.id);say('status',error?'保存失败：'+error.message:'已保存：'+p.name+'。顾客网站刷新后会显示新价格。');});$('products').appendChild(row);}say('status',(data||[]).length?'商品已载入。':'目前没有商品，请先在 Supabase SQL Editor 执行 supabase_setup.sql。');}
$('loginBtn').onclick=async()=>{say('loginStatus','正在登录…');const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){say('loginStatus','登录失败：'+error.message);return;}const {data:admin,error:adminError}=await db.from('admin_users').select('user_id').eq('user_id',data.user.id).maybeSingle();if(adminError||!admin){await db.auth.signOut();say('loginStatus','此账号没有管理员权限。请检查 admin_users 表。');return;}$('login').hidden=true;$('dashboard').hidden=false;await showProducts();};
$('logoutBtn').onclick=async()=>{await db.auth.signOut();$('dashboard').hidden=true;$('login').hidden=false;say('loginStatus','已退出登录。');};
</script></body></html>
